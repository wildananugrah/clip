# Worker compose service for standalone or multi-host deployment
# Usage: docker compose -f docker-compose.worker.yml up -d --build

name: clip-worker

services:
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Override relative WORK_DIR to an absolute scratch path in container
      WORK_DIR: /app/worker/output/.work
      WORKER_HOST_ID: ${WORKER_HOST_ID:-worker-docker}
    volumes:
      # Optional persistence for scratch / downloads / cache
      - worker-work:/app/worker/output/.work
      # YouTube cookies (pair with YTDLP_COOKIES=/run/secrets/yt-cookies.txt).
      # - ./yt-cookies.txt:/run/secrets/yt-cookies.txt:ro
    network_mode: host

volumes:
  worker-work:
